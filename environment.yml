name: dhn
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1  # Change to 11.8 if needed, or remove for CPU-only
  - numpy
  - scipy
  - matplotlib
  - pip
  - pip:
    - ml-collections
    - absl-py
    - tensorboard
    - wandb





